  .arrow{color:#999;font-size:22px}
  .empty{text-align:center;color:#777;margin-top:40px}
  @media (prefers-color-scheme:dark){body{background:#111;color:#fff}.top{background:rgba(17,17,17,.92)}.search,.card{background:#1c1c1e;color:#fff}.count{color:#aaa}}

const q=document.getElementById('q');
const list=document.getElementById('list');
const count=document.getElementById('count');
function render(){
  const key=q.value.trim().toLowerCase();
  const data=links.filter(x=>x.name.toLowerCase().includes(key));
  count.textContent = `共 ${data.length} 筆`;
  list.innerHTML='';
  if(!data.length){list.innerHTML='<div class="empty">找不到符合的大樓</div>'; return;}
  data.forEach(x=>{
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML=`<span class="name">${x.name}</span><span class="arrow">›</span>`;
    b.onclick=()=>window.open(x.url,'_blank');
    list.appendChild(b);
  });
}
q.addEventListener('input',render);
render();
